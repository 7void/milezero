services:
  postgres:
    image: postgres:16-alpine
    container_name: milezero-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: milezero
      POSTGRES_PASSWORD: milezeropassword
      POSTGRES_DB: milezerodb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milezero -d milezerodb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
